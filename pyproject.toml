[project]
name = "bderp"
version = "0.1.0"
description = "PyQt5 + MySQL desktop ERP prototype (purchases, sales, HR, stock-market tweets)"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15,<5.16",
    "PyMySQL[rsa]>=1.1,<2",  # rsa: MySQL 8 caching_sha2_password
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
# "Bolsa de Valores" window; also needs BDERP_TWITTER_ENABLED=1
twitter = ["python-twitter>=3.5,<4"]

[tool.uv]
package = false
